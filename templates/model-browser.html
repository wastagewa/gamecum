<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Browse Images by Model</title>

    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <script>
        (function(){
            var theme = null;
            try { theme = localStorage.getItem('imgur.theme'); } catch(e) {}
            if(!theme){
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                theme = prefersDark ? 'dark' : 'light';
            }
            if(theme === 'dark'){
                document.documentElement.setAttribute('data-theme','dark');
                document.documentElement.style.colorScheme = 'dark';
            } else {
                document.documentElement.removeAttribute('data-theme');
                document.documentElement.style.colorScheme = 'light';
            }
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .browse-wrap { max-width: 1500px; margin: 0 auto; padding: 1.5rem 1.5rem 3rem; }
        .browse-header { margin-bottom: 1.75rem; text-align: center; }
        .browse-header h1 { font-size: 2.2rem; margin-bottom: 0.4rem; color: var(--primary-color); }
        .browse-header p { font-size: 1rem; color: var(--text-secondary); }

        .browse-layout { display: grid; grid-template-columns: 320px 1fr; gap: 1.5rem; align-items: start; }

        .browse-sidebar {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 1.25rem;
            position: sticky;
            top: 90px;
            max-height: calc(100vh - 110px);
            overflow-y: auto;
        }
        .facet-search input {
            width: 100%; padding: 0.6rem 0.8rem; border: 1px solid var(--border-color);
            border-radius: 8px; background: var(--input-bg); color: var(--text-color);
            font-size: 0.88rem; margin-bottom: 0.6rem;
        }
        .facet-sort-options { display: flex; gap: 0.5rem; margin-bottom: 0.9rem; flex-wrap: wrap; }
        .facet-sort-btn {
            padding: 0.4rem 0.8rem; border: 1px solid var(--border-color); border-radius: 8px;
            background: var(--input-bg); color: var(--text-color); cursor: pointer; font-size: 0.8rem;
        }
        .facet-sort-btn.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }
        .facet-list { display: flex; flex-direction: column; gap: 0.4rem; }
        .facet-item {
            display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
            padding: 0.6rem 0.75rem; border-radius: 10px; cursor: pointer;
            background: var(--input-bg); border: 1px solid var(--border-color);
            font-size: 0.88rem; font-weight: 600; transition: all 0.15s ease;
        }
        .facet-item:hover { border-color: var(--primary-color); }
        .facet-item.selected { background: linear-gradient(135deg, #f59e0b, #d97706); color: #1a1206; border-color: transparent; }
        .facet-count {
            font-size: 0.75rem; font-weight: 700; background: rgba(0,0,0,.15);
            padding: 0.1rem 0.5rem; border-radius: 10px; flex-shrink: 0;
        }
        .facet-item.selected .facet-count { background: rgba(0,0,0,.25); }

        .match-mode-row { display: flex; gap: 1rem; margin: 1.1rem 0 0.4rem; font-size: 0.85rem; }
        .match-mode-row label { display: flex; align-items: center; gap: 0.4rem; cursor: pointer; }

        .browse-main {
            background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border-color);
            padding: 1.5rem;
        }
        .selected-chips-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 1rem; }
        .selected-chip {
            display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.35rem 0.8rem;
            border-radius: 20px; font-size: 0.82rem; font-weight: 700; color: #1a1206;
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }
        .selected-chip button { background: none; border: none; color: inherit; cursor: pointer; font-size: 1rem; opacity: 0.75; }
        .selected-chip button:hover { opacity: 1; }
        .clear-filters-btn {
            margin-left: auto; padding: 0.4rem 0.9rem; border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--input-bg); color: var(--text-color); cursor: pointer; font-size: 0.82rem;
        }

        .results-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; color: var(--text-secondary); font-size: 0.92rem; }
        .results-count { font-weight: 800; color: var(--primary-color); }

        .images-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1.25rem; }
        .image-card {
            background: var(--input-bg); border-radius: 14px; overflow: hidden; border: 1px solid var(--border-color);
            transition: all 0.25s ease; cursor: pointer; position: relative;
        }
        .image-card:hover { transform: translateY(-4px); border-color: var(--primary-color); box-shadow: 0 14px 34px rgba(0,0,0,0.25); }
        .image-card-img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
        .image-card-info { padding: 0.85rem; }
        .image-card-collection {
            font-size: 0.72rem; background: var(--primary-color); color: white; padding: 0.2rem 0.55rem;
            border-radius: 5px; display: inline-block; margin-bottom: 0.5rem; font-weight: 700;
        }
        .image-card-badges { display: flex; flex-wrap: wrap; gap: 0.3rem; max-height: 62px; overflow: hidden; }
        .card-badge { font-size: 0.68rem; font-weight: 700; padding: 0.18rem 0.5rem; border-radius: 10px; }
        .card-badge.badge-bodypart { background: rgba(56,189,248,.9); color: #06222f; }
        .card-badge.badge-tag { background: rgba(255,107,129,.85); color: white; }
        .card-badge.badge-more { background: var(--border-color); color: var(--text-secondary); }

        .loading, .empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--text-secondary); }
        .empty-state i { font-size: 2.6rem; margin-bottom: 0.9rem; opacity: 0.5; display: block; }

        @media (max-width: 980px) {
            .browse-layout { grid-template-columns: 1fr; }
            .browse-sidebar { position: static; max-height: none; }
        }
        @media (max-width: 560px) {
            .browse-wrap { padding: 1rem; }
            .browse-header h1 { font-size: 1.6rem; }
            .images-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.8rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">
                <i class="fas fa-images"></i>
                <span>ImgurMemory</span>
            </a>
            <div class="navbar-menu">
                <a href="/" class="navbar-link"><i class="fas fa-home"></i> Home</a>
                <div class="navbar-dropdown">
                    <button class="navbar-link navbar-dropdown-toggle"><i class="fas fa-folder-open"></i> View Collections <i class="fas fa-caret-down"></i></button>
                    <div class="navbar-dropdown-menu" id="collectionsDropdown"></div>
                </div>
                <a href="/tags" class="navbar-link"><i class="fas fa-tags"></i> Browse Tags</a>
                <a href="/models" class="navbar-link active"><i class="fas fa-user"></i> Browse Models</a>
                <a href="/manage-collections" class="navbar-link"><i class="fas fa-cog"></i> Manage</a>
                <a href="/manage-models" class="navbar-link"><i class="fas fa-user-tag"></i> Manage Models</a>
                <a href="/manage-quote-prompt" class="navbar-link"><i class="fas fa-quote-right"></i> Quote Prompt</a>
                <button id="themeToggle" class="navbar-theme-toggle" type="button">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="browse-wrap">
            <div class="browse-header">
                <h1><i class="fas fa-user"></i> Browse Images by Model</h1>
                <p>Find every image a subject/person appears in, across all collections</p>
            </div>

            <div class="browse-layout">
                <aside class="browse-sidebar">
                    <div class="facet-search"><input type="text" id="modelSearchInput" placeholder="Search models..."></div>
                    <div class="facet-sort-options">
                        <button class="facet-sort-btn active" data-sort="count"><i class="fas fa-sort-numeric-down"></i> Count</button>
                        <button class="facet-sort-btn" data-sort="alpha"><i class="fas fa-sort-alpha-down"></i> Name</button>
                    </div>
                    <div class="facet-list" id="modelList"><div class="loading"><i class="fas fa-spinner fa-spin"></i></div></div>

                    <div class="match-mode-row">
                        <label><input type="radio" name="matchMode" value="any" checked> Match any</label>
                        <label><input type="radio" name="matchMode" value="all"> Match all</label>
                    </div>
                </aside>

                <div class="browse-main">
                    <div class="selected-chips-row" id="selectedChipsRow" style="display:none;"></div>

                    <div class="results-info" id="resultsInfo" style="display:none;">
                        <span>Showing <span class="results-count" id="resultCount">0</span> images</span>
                    </div>

                    <div id="imagesContainer">
                        <div class="empty-state">
                            <i class="fas fa-search"></i>
                            <h2>Select a model to view images</h2>
                            <p>Click a name in the sidebar to filter images across all collections</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/navbar-collections.js') }}"></script>
    <script src="{{ url_for('static', filename='js/html-utils.js') }}"></script>
    <script>
        let allModels = [];
        let selectedModelIds = new Set();
        let currentSort = 'count';

        async function loadModels() {
            try {
                const response = await fetch('/api/models-with-counts');
                const data = await response.json();
                if (data.success) { allModels = data.models; renderModels(); }
            } catch (error) {
                console.error('Error loading models:', error);
                document.getElementById('modelList').innerHTML = '<div class="empty-state"><p>Error loading models</p></div>';
            }
        }

        function renderModels() {
            const term = document.getElementById('modelSearchInput').value.toLowerCase();
            const list = document.getElementById('modelList');
            let filtered = allModels.filter(m => m.name.toLowerCase().includes(term));
            filtered.sort(currentSort === 'alpha' ? (a, b) => a.name.localeCompare(b.name) : (a, b) => b.count - a.count);

            if (!filtered.length) { list.innerHTML = '<div class="empty-state"><p>No models found</p></div>'; return; }

            list.innerHTML = filtered.map(m => `
                <div class="facet-item ${selectedModelIds.has(m.id) ? 'selected' : ''}" data-id="${m.id}" data-name="${escapeHtml(m.name)}">
                    <span>${escapeHtml(m.name)}</span>
                    <span class="facet-count">${m.count}</span>
                </div>
            `).join('');

            list.querySelectorAll('.facet-item').forEach(el => {
                el.addEventListener('click', () => {
                    const id = parseInt(el.dataset.id, 10);
                    selectedModelIds.has(id) ? selectedModelIds.delete(id) : selectedModelIds.add(id);
                    renderModels();
                    renderSelectedChips();
                    loadImages();
                });
            });
        }

        function renderSelectedChips() {
            const row = document.getElementById('selectedChipsRow');
            if (selectedModelIds.size === 0) { row.style.display = 'none'; return; }
            row.style.display = 'flex';
            row.innerHTML = Array.from(selectedModelIds).map(id => {
                const model = allModels.find(m => m.id === id);
                return `<span class="selected-chip">${escapeHtml(model ? model.name : id)}<button data-id="${id}">&times;</button></span>`;
            }).join('') + '<button class="clear-filters-btn" id="clearFiltersBtn">Clear all</button>';

            row.querySelectorAll('button[data-id]').forEach(btn => {
                btn.addEventListener('click', () => {
                    selectedModelIds.delete(parseInt(btn.dataset.id, 10));
                    renderModels(); renderSelectedChips(); loadImages();
                });
            });
            document.getElementById('clearFiltersBtn').addEventListener('click', () => {
                selectedModelIds.clear();
                renderModels(); renderSelectedChips(); loadImages();
            });
        }

        async function loadImages() {
            const container = document.getElementById('imagesContainer');
            const resultsInfo = document.getElementById('resultsInfo');

            if (selectedModelIds.size === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <h2>Select a model to view images</h2>
                        <p>Click a name in the sidebar to filter images across all collections</p>
                    </div>
                `;
                resultsInfo.style.display = 'none';
                return;
            }

            container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading images...</div>';

            try {
                const matchMode = document.querySelector('input[name="matchMode"]:checked').value;
                const idsParam = Array.from(selectedModelIds).map(id => `model_id=${id}`).join('&');
                const matchAllParam = matchMode === 'all' ? '&matchAll=true' : '';

                const response = await fetch(`/api/images-by-model?${idsParam}${matchAllParam}`);
                const data = await response.json();

                if (data.success) {
                    renderImages(data.images);
                    document.getElementById('resultCount').textContent = data.count;
                    resultsInfo.style.display = 'flex';
                } else {
                    container.innerHTML = '<div class="empty-state"><p>Error loading images</p></div>';
                }
            } catch (error) {
                console.error('Error loading images:', error);
                container.innerHTML = '<div class="empty-state"><p>Error loading images</p></div>';
            }
        }

        function renderImages(images) {
            const container = document.getElementById('imagesContainer');
            if (images.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h2>No images found</h2>
                        <p>Try selecting a different model</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="images-grid">
                    ${images.map(img => {
                        const bodyParts = Object.entries(img.body_parts || {});
                        const tags = img.tags || [];
                        const badges = [
                            ...bodyParts.slice(0, 2).map(([part]) => `<span class="card-badge badge-bodypart">${escapeHtml(part)}</span>`),
                            ...tags.slice(0, 3).map(t => `<span class="card-badge badge-tag">${escapeHtml(t)}</span>`),
                        ];
                        const totalExtra = bodyParts.length + tags.length - badges.length;
                        if (totalExtra > 0) badges.push(`<span class="card-badge badge-more">+${totalExtra}</span>`);
                        return `
                            <div class="image-card" onclick="openImage('${escapeHtml(img.url)}')">
                                <img src="${escapeHtml(img.url)}" alt="${escapeHtml(img.filename)}" class="image-card-img" loading="lazy">
                                <div class="image-card-info">
                                    <div class="image-card-collection">${escapeHtml(img.collection)}</div>
                                    <div class="image-card-badges">${badges.join('')}</div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function openImage(url) {
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0,0,0,0.9); display: flex; align-items: center;
                justify-content: center; z-index: 1000; cursor: pointer;
            `;
            modal.innerHTML = `<img src="${escapeHtml(url)}" style="max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 8px;">`;
            modal.addEventListener('click', () => modal.remove());
            document.body.appendChild(modal);
        }

        document.getElementById('modelSearchInput').addEventListener('input', renderModels);
        document.querySelectorAll('[data-sort]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('[data-sort]').forEach(b => b.classList.remove('active'));
                e.target.closest('[data-sort]').classList.add('active');
                currentSort = e.target.closest('[data-sort]').dataset.sort;
                renderModels();
            });
        });
        document.querySelectorAll('input[name="matchMode"]').forEach(r => r.addEventListener('change', loadImages));

        loadModels();
    </script>
</body>
</html>
